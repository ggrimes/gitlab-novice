<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f8b8d"/></marker><marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ec6b56"/></marker><marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#13294b"/></marker><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6770"/></marker></defs>
<rect x="20" y="20" width="260" height="90" rx="14" fill="#f6f3ee" stroke="#13294b" stroke-width="4"/><text x="150.0" y="65.0" text-anchor="middle" font-size="32" font-weight="800" fill="#13294b">Edited</text><text x="150.0" y="95.0" text-anchor="middle" font-size="20" font-weight="400" fill="#5b6770">not committed yet</text>
<path d="M150,116 L150,150" fill="none" stroke="#ec6b56" stroke-width="4" marker-end="url(#ac)"/>
<rect x="20" y="156" width="260" height="48" rx="24" fill="#fff" stroke="#ec6b56" stroke-width="3"/>
<text x="150" y="188" text-anchor="middle" font-size="20" font-weight="700" fill="#ec6b56" font-family="'JetBrains Mono', Menlo, monospace">git restore &lt;file&gt;</text>
<text x="150" y="238" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2933">back to the last commit</text>
<text x="150" y="264" text-anchor="middle" font-size="18" font-weight="400" fill="#5b6770">uncommitted edits are lost</text>
<rect x="370" y="20" width="260" height="90" rx="14" fill="#f6f3ee" stroke="#ec6b56" stroke-width="4"/><text x="500.0" y="65.0" text-anchor="middle" font-size="32" font-weight="800" fill="#13294b">Committed</text><text x="500.0" y="95.0" text-anchor="middle" font-size="20" font-weight="400" fill="#5b6770">on Eddie, not pushed</text>
<path d="M500,116 L500,150" fill="none" stroke="#ec6b56" stroke-width="4" marker-end="url(#ac)"/>
<rect x="370" y="156" width="260" height="48" rx="24" fill="#fff" stroke="#ec6b56" stroke-width="3"/>
<text x="500" y="188" text-anchor="middle" font-size="20" font-weight="700" fill="#ec6b56" font-family="'JetBrains Mono', Menlo, monospace">git commit --amend</text>
<text x="500" y="238" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2933">redo the last commit</text>
<text x="500" y="264" text-anchor="middle" font-size="18" font-weight="400" fill="#5b6770">rewrites it: fine, nobody has it</text>
<rect x="720" y="20" width="260" height="90" rx="14" fill="#f6f3ee" stroke="#0f8b8d" stroke-width="4"/><text x="850.0" y="65.0" text-anchor="middle" font-size="32" font-weight="800" fill="#13294b">Pushed</text><text x="850.0" y="95.0" text-anchor="middle" font-size="20" font-weight="400" fill="#5b6770">on GitLab</text>
<path d="M850,116 L850,150" fill="none" stroke="#ec6b56" stroke-width="4" marker-end="url(#ac)"/>
<rect x="720" y="156" width="260" height="48" rx="24" fill="#fff" stroke="#ec6b56" stroke-width="3"/>
<text x="850" y="188" text-anchor="middle" font-size="20" font-weight="700" fill="#ec6b56" font-family="'JetBrains Mono', Menlo, monospace">git revert &lt;hash&gt;</text>
<text x="850" y="238" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2933">new commit that undoes it</text>
<text x="850" y="264" text-anchor="middle" font-size="18" font-weight="400" fill="#5b6770">adds history: always safe</text>
<path d="M286,65 L362,65" fill="none" stroke="#0f8b8d" stroke-width="4" marker-end="url(#at)"/>
<text x="325" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#0f8b8d" font-family="'JetBrains Mono', Menlo, monospace">commit</text>
<path d="M636,65 L712,65" fill="none" stroke="#0f8b8d" stroke-width="4" marker-end="url(#at)"/>
<text x="675" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#0f8b8d" font-family="'JetBrains Mono', Menlo, monospace">push</text>
<line x1="20" y1="290" x2="980" y2="290" stroke="#d9dee3" stroke-width="2"/>
<text x="500" y="320" text-anchor="middle" font-size="19" font-weight="400" fill="#5b6770">Not a mistake, just in the way of a git pull?  →  git stash</text>
</svg>
