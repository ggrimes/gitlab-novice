<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<rect x="20" y="90" width="260" height="90" rx="14" fill="#f6f3ee" stroke="#13294b" stroke-width="4"/><text x="150.0" y="135.0" text-anchor="middle" font-size="32" font-weight="800" fill="#13294b">Working dir</text><text x="150.0" y="165.0" text-anchor="middle" font-size="20" font-weight="400" fill="#5b6770">what you edit</text>
<rect x="370" y="90" width="260" height="90" rx="14" fill="#f6f3ee" stroke="#0f8b8d" stroke-width="4"/><text x="500.0" y="135.0" text-anchor="middle" font-size="32" font-weight="800" fill="#13294b">Staging area</text><text x="500.0" y="165.0" text-anchor="middle" font-size="20" font-weight="400" fill="#5b6770">after git add</text>
<rect x="720" y="90" width="260" height="90" rx="14" fill="#f6f3ee" stroke="#ec6b56" stroke-width="4"/><text x="850.0" y="135.0" text-anchor="middle" font-size="32" font-weight="800" fill="#13294b">Last commit</text><text x="850.0" y="165.0" text-anchor="middle" font-size="20" font-weight="400" fill="#5b6770">HEAD</text>
<path d="M150,82 L150,64 L500,64 L500,82" fill="none" stroke="#5b6770" stroke-width="3"/>
<text x="325" y="50" text-anchor="middle" font-size="19" font-weight="700" fill="#5b6770" font-family="'JetBrains Mono', Menlo, monospace">git diff</text>
<path d="M500,82 L500,64 L850,64 L850,82" fill="none" stroke="#5b6770" stroke-width="3"/>
<text x="675" y="50" text-anchor="middle" font-size="19" font-weight="700" fill="#5b6770" font-family="'JetBrains Mono', Menlo, monospace">git diff --staged</text>
<path d="M150,188 L150,210 L850,210 L850,188" fill="none" stroke="#ec6b56" stroke-width="4"/>
<text x="500" y="244" text-anchor="middle" font-size="24" font-weight="700" fill="#ec6b56" font-family="'JetBrains Mono', Menlo, monospace">git diff HEAD</text>
<text x="500" y="266" text-anchor="middle" font-size="18" font-weight="400" fill="#5b6770">everything since the last commit, staged or not</text>
</svg>
